[package]
name = "rustc_codegen_mires"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
object = { workspace = true, default-features = false, features = ["read", "std", "archive"] }
sha2 = { workspace = true }
# The rustc-free JIR-S schema (Phase 1 W1a). The encoder in `jir/encode` targets it.
mires-marker-abi = { path = "../mires-marker-abi" }
rcgjs-object = { path = "../rcgjs-object" }
# The link manifest handed to `jsc-link`, and the `late_ir` summary the object carries.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true
