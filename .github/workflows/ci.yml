name: standalone-v2
on: [push, pull_request]
concurrency:
  group: mires-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint-and-docs
      - run: rustc --version --verbose
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check Clippy lints
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p mires-build --all-features --all-targets -- -D warnings
          cargo clippy -p rcgjs-object --features interp --all-targets -- -D warnings
      - name: Check rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps
          cargo doc -p mires-build --all-features --no-deps
          cargo doc -p rcgjs-object --features interp --no-deps
      - name: Check publishable crate package lists
        run: |
          for pkg in mires-marker-abi js-macro js-extern-macro mires-js mires mires-build cargo-mires; do
            cargo package --list -p "$pkg" >/dev/null
          done
      - name: Lint shell scripts
        run: |
          sh -n scripts/install.sh
          bash -n scripts/ergonomics-e2e.sh scripts/metamorphic-test.sh scripts/fuzz/run.sh
          shellcheck scripts/install.sh scripts/ergonomics-e2e.sh scripts/metamorphic-test.sh scripts/fuzz/run.sh

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          command: check all

  cross-platform-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-${{ matrix.os }}
      - run: rustc --version --verbose
      - name: Test cargo-mires and mires-build
        run: cargo test --locked -p cargo-mires -p mires-build

  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: compiler
      - run: rustc --version --verbose
      - run: npm ci --ignore-scripts
      - run: bash scripts/build.sh --locked
      - run: cargo build --release --locked -p cargo-mires
      - run: cargo test --workspace
      - run: cargo test -p mires-build --all-features
      - run: SKIP_BUILD=1 bash scripts/build_sysroot.sh
      - run: SKIP_BUILD=1 JS_EXTRA_ARGS='js-lane=jir js-opt=on' bash scripts/build_sysroot.sh
      - run: SKIP_BUILD=1 JS_EXTRA_ARGS='js-lane=jir js-opt=on' bash scripts/test.sh --require-core
      - name: Safe-Rust regression gates (known-gaps, round1-open, round2-open)
        run: |
          python3 scripts/check-known-gaps.py
          python3 scripts/check-round1-open.py
          python3 scripts/check-round2-open.py --mode both
      - name: Cross-profile metamorphic oracle (fast)
        run: bash scripts/metamorphic-test.sh --fast --skip-build -j 4
      - name: Differential fuzz smoke check
        run: bash scripts/fuzz/run.sh --ci-smoke -j 4
      - name: Run cargo mires test differential check on example workspaces
        run: |
          target/release/cargo-mires mires test --diff \
            --manifest-path examples/fullstack-workspace/Cargo.toml \
            -p shared --mires-root "$PWD"
          target/release/cargo-mires mires test --diff \
            --manifest-path examples/npm-markdown/Cargo.toml \
            --mires-root "$PWD"
      - name: Run continuous differential oracle (fast tier)
        run: node oracle/run-oracle.mjs --tier fast
      - run: bash scripts/ergonomics-e2e.sh
      - run: bash scripts/check.sh
      - run: node scripts/standalone-check.mjs
      - run: SKIP_BUILD=1 bash scripts/cleanup-smoke.sh
      - run: SKIP_BUILD=1 bash scripts/noop-landing-pads-test.sh
      - run: python3 scripts/cleanup-transport-test.py
      - run: bash scripts/cleanup-admission-test.sh
      - run: cargo +stable run --manifest-path examples/standalone-consumer/Cargo.toml
