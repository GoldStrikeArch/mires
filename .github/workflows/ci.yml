name: standalone-v2
on: [push, pull_request]
concurrency:
  group: mires-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version --verbose
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p rcgjs-object --features interp --all-targets -- -D warnings
      - run: npm ci --ignore-scripts
      - run: bash scripts/build.sh --locked
      - run: cargo build --release --locked -p cargo-mires
      - run: cargo test --workspace
      - run: SKIP_BUILD=1 bash scripts/build_sysroot.sh
      - run: SKIP_BUILD=1 JS_EXTRA_ARGS='js-lane=jir js-opt=on' bash scripts/build_sysroot.sh
      - run: SKIP_BUILD=1 JS_EXTRA_ARGS='js-lane=jir js-opt=on' bash scripts/test.sh --require-core
      - run: bash scripts/ergonomics-e2e.sh
      - run: bash scripts/check.sh
      - run: node scripts/standalone-check.mjs
      - run: SKIP_BUILD=1 bash scripts/cleanup-smoke.sh
      - run: SKIP_BUILD=1 bash scripts/noop-landing-pads-test.sh
      - run: python3 scripts/cleanup-transport-test.py
      - run: bash scripts/cleanup-admission-test.sh
      - run: cargo +stable run --manifest-path examples/standalone-consumer/Cargo.toml
