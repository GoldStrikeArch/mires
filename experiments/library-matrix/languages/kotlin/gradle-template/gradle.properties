kotlin.js.ir.output.granularity=whole-program
# Reproducible output. The Kotlin/JS 2.4.10 IR compiler orders the supertypes it emits in
# initMetadataForClass(...) by iterating identity-hashed sets, so the emit changes between builds
# with the JVM's default (random, per-thread) identity hashes. A constant identity hash
# (-XX:hashCode=2) in the compiling JVM, with the compiler running in that JVM (in-process), makes
# the iteration order the insertion order. It changes no compiler setting and no emitted code
# path; see languages/kotlin/build.mjs for the measurements.
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx4g -XX:+UnlockExperimentalVMOptions -XX:hashCode=2
