kotlin.js.ir.output.granularity=whole-program
# Reproducible output. The Kotlin/JS 2.4.10 IR compiler orders the supertypes it emits in
# initMetadataForClass(...) by iterating identity-hashed sets, so the emit could change between
# builds with the JVM's default identity hashes. A constant identity hash (-XX:hashCode=2) in the
# compiling JVM, with the compiler running in that JVM (in-process), makes that order stable. It
# changes no compiler setting and no emitted code path (same setting as the library matrix's
# Kotlin template, experiments/library-matrix/languages/kotlin/gradle-template).
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx4g -XX:+UnlockExperimentalVMOptions -XX:hashCode=2
