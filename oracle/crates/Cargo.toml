[workspace]

[package]
name = "mires-oracle-crates"
version = "0.1.0"
edition = "2021"
publish = false
description = "Continuous differential test suite over popular pure-Rust crates.io crates for Mires."

[dependencies]
adler2 = "2.0"
base64 = "0.22"
bitflags = "2.11"
bytes = "1"
crc32fast = "1.5"
csv = "1.3"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
fnv = "1.0"
hex = "0.4"
itertools = "0.14"
miniz_oxide = "0.8"
ordered-float = "5.0"
percent-encoding = "2.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex-lite = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = "1.15"
unicode-ident = "1.0"
url = "2.5"
