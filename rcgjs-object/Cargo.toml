[package]
name = "rcgjs-object"
version = "0.1.0"
edition = "2021"
publish = false
description = "The rustc-free JIR-S schema shared by the rustc_codegen_js producer and the jsc-link consumer"

[lib]
crate-type = ["rlib"]

[features]
interp = []

[dependencies]
# The relooper, for the one `Payload` impl that says what a `jsast::Stmt` costs to duplicate.
structurizer = { path = "../structurizer" }
# The section codec: deflate for the content-addressed body blobs, the origins, and the interns.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
# tests/try_catch.rs runs its JavaScript in reused node workers (RCGJS_TEST_NODE=spawn: one node
# each). The unit tests in src/ spawn node themselves; see test-node's crate documentation.
test-node = { path = "../test-node" }

[lints]
workspace = true
