[workspace]
resolver = "2"
exclude = ["experiments", "experiments-pro", "recovery", "legacy", "mires-std", "mires-test", "oracle"]
members = [
    "backend",
    "rcgjs-object",
    "jsc-link",
    "mires-build",
    "mires-marker-abi",
    "structurizer",
    "mires-js",
    "mires",
    "cargo-mires",
    "js-extern-macro",
    "js-macro",
    "test-node",
]

[workspace.dependencies]
object = { version = "0.39.1", default-features = false }
serde_json = "1.0.149"
sha2 = "0.10.9"

# The project rule is safe Rust only. `deny` rather than `forbid` so the host
# FFI seam (`mires-js::collections`) and the backend's exported entry point can
# `#[allow]` it at the smallest scope.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Every `unsafe` block must carry an explicit `// SAFETY:` justification.
undocumented_unsafe_blocks = "deny"
# Every lint suppression (`#[allow(...)]`) must explain why it is needed.
allow_attributes_without_reason = "warn"
# Keep functions focused and prefer sum types / context structs over bool bags
# (thresholds configured in `clippy.toml`).
too_many_lines = "warn"
fn_params_excessive_bools = "warn"
# Catch stray debug/placeholder code and unnecessary allocations.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
empty_drop = "warn"
redundant_clone = "warn"

# Dev builds optimise third-party code: the fixture-corpus tests spend a large share of their
# time in it (miniz_oxide inflate, object, postcard, serde_json; brotli and flate2 in the
# planner), and opt-level 2 runs them as fast as 3. Workspace members stay at opt-level 0,
# and so do the proc macros and everything under them: a package's profile is part of the
# identity of everything built on it, and the scripts hand rustc
# `target/debug/libjs_extern_macro.dylib` and `libjs_macro.dylib`, which must not change.
# `"*"` outranks `build-override`, hence the list: the registry packages that
# `cargo tree -e normal,build -p <macro>` prints for js-extern-macro, js-macro, serde_derive
# and thiserror-impl. Only `dev` is touched: the release backend dylib keys every sysroot.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.proc-macro2]
opt-level = 0
[profile.dev.package.quote]
opt-level = 0
[profile.dev.package.syn]
opt-level = 0
[profile.dev.package.unicode-ident]
opt-level = 0
[profile.dev.package.serde_derive]
opt-level = 0
[profile.dev.package.thiserror-impl]
opt-level = 0
